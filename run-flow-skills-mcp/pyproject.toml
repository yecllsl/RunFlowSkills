[project]
name = "run-flow-skills-mcp"
version = "0.1.1"
description = "深度跑步分析 Skills 套件 - MCP Server + Web"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "pydantic>=2.0.0",
    "polars>=0.20.0",
    "fitparse>=1.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "ruff>=0.5.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
run-flow-skills-mcp = "run_flow_skills_mcp.server:main"
run-flow-skills-web = "run_flow_skills_mcp.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/run_flow_skills_mcp"]

[tool.pytest.ini_options]
markers = [
    "e2e: Playwright E2E tests, run with `uv run pytest -m e2e`",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A"]

[tool.uv]
# uv 配置

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv.pip]
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_optional = true
